  I love the sea. It has a special place in my heart, the cobalt-colored ocean with deep cozy waves and the spectacular vastness, namely, my secret spot.

  I used to go to the nearest cafe to the sea and sit at a small table by the window. While reading a book, a piece of Jazz music was being played in the background.

  I wouldn't have been happier than ever if there had not been a secret place to refresh and motivate myself.
